<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="wix-html-scroll" content="no-scroll">
<title>Greenways — Water Line Sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/HTMLS%20GWM%20GWB/js/greenways-marketplace-page-backdrop.css?v=glass2">
<script src="/HTMLS%20GWM%20GWB/js/greenways-module-demo.js"></script>
<script src="/HTMLS%20GWM%20GWB/js/greenways-agent-topic-bridge.js"></script>
<style>
  :root {
    --bg: #070e12;
    --text: #e8f4f8;
    --muted: #8eabb4;
    --cyan: #22d3ee;
    --green: #28a745;
    --gold: #c9a961;
    --amber: #f59e0b;
    --font: 'Space Grotesk', system-ui, sans-serif;
    --font-clean: 'IBM Plex Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overflow-x: hidden;
    line-height: 1.5;
  }
  .sk-page {
    position: relative;
    z-index: 1;
    max-width: 920px;
    margin: 0 auto;
    padding: 18px 16px 40px;
  }
  .sk-return {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 0 0 14px; padding: 8px 10px; border-radius: 12px;
    border: 1px solid rgba(201, 169, 97, 0.35);
    background: rgba(8, 16, 22, 0.92); backdrop-filter: blur(12px);
  }
  .sk-return[hidden] { display: none !important; }
  .sk-return-btn {
    border-radius: 999px; border: 1px solid rgba(201, 169, 97, 0.55);
    background: rgba(201, 169, 97, 0.12); color: #f0d78a;
    font: inherit; font-size: 0.82rem; font-weight: 600; padding: 7px 12px; cursor: pointer;
  }
  .sk-return-hint { font-size: 0.72rem; color: var(--muted); }
  .sk-hero { text-align: center; margin-bottom: 14px; }
  .sk-hero h1 {
    font-size: clamp(1.5rem, 3.6vw, 2rem); font-weight: 700; letter-spacing: -0.03em;
    background: linear-gradient(135deg, #fff 0%, var(--cyan) 55%, #86efac 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sk-hero p { margin-top: 10px; color: #e8f6fa; font-size: 0.95rem; max-width: 36rem; margin-left: auto; margin-right: auto; }
  .sk-trust {
    margin: 0 auto 14px; max-width: 36rem; padding: 10px 12px; border-radius: 10px;
    border: 1px solid rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.08);
    font-size: 0.78rem; color: #fde68a; text-align: center;
  }
  .sk-status { font-size: 0.82rem; color: var(--muted); margin-bottom: 10px; min-height: 1.2em; }
  .sk-status.is-error { color: #fca5a5; }
  .sk-lanes {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-bottom: 14px;
  }
  .sk-lane {
    text-align: left; padding: 12px; border-radius: 12px; cursor: pointer; font: inherit; color: var(--text);
    border: 1px solid rgba(34, 212, 255, 0.28); background: rgba(10, 20, 28, 0.72);
  }
  .sk-lane.is-active { border-color: rgba(34, 212, 255, 0.7); background: rgba(14, 36, 48, 0.9); }
  .sk-lane strong { display: block; font-size: 0.88rem; }
  .sk-lane span { font-size: 0.72rem; color: var(--muted); }
  .sk-summary {
    padding: 14px; border-radius: 16px; margin-bottom: 14px;
    border: 1px solid rgba(34, 212, 255, 0.22); background: rgba(12, 22, 28, 0.88);
  }
  .sk-summary h2 { font-size: 1.1rem; margin-bottom: 6px; font-family: var(--font-clean); }
  .sk-summary p { color: #d7e8ee; font-size: 0.9rem; }
  .sk-totals {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 12px;
  }
  .sk-total {
    padding: 10px 12px; border-radius: 10px;
    background: rgba(40, 167, 69, 0.1); border: 1px solid rgba(40, 167, 69, 0.28);
  }
  .sk-total strong {
    display: block; color: #9ae6b0; font-size: 0.68rem; letter-spacing: 0.06em;
    text-transform: uppercase; margin-bottom: 4px;
  }
  .sk-total span { font-family: var(--font-clean); font-size: 1.15rem; font-weight: 600; }
  .sk-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .sk-btn {
    appearance: none; border-radius: 999px; border: 1px solid rgba(34, 212, 255, 0.35);
    background: rgba(34, 212, 255, 0.08); color: var(--cyan);
    font: inherit; font-size: 0.78rem; font-weight: 600; padding: 7px 12px; cursor: pointer; text-decoration: none;
  }
  .sk-btn--gold { border-color: rgba(201, 169, 97, 0.5); background: rgba(201, 169, 97, 0.14); color: #f0d78a; }
  .sk-btn--green { border-color: rgba(40, 167, 69, 0.45); background: rgba(40, 167, 69, 0.12); color: #9ae6b0; }
  .sk-equip { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .sk-row {
    display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start;
    padding: 14px; border-radius: 14px;
    border: 1px solid rgba(34, 212, 255, 0.2); background: rgba(12, 22, 28, 0.86);
  }
  .sk-row h3 { font-size: 0.98rem; font-family: var(--font-clean); }
  .sk-row p { margin-top: 4px; font-size: 0.82rem; color: #c9dbe3; }
  .sk-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .sk-chip {
    font-size: 0.68rem; font-weight: 600; padding: 3px 8px; border-radius: 999px;
    border: 1px solid rgba(34, 212, 255, 0.3); color: var(--cyan); background: rgba(34, 212, 255, 0.08);
  }
  .sk-chip--gas { border-color: rgba(245, 158, 11, 0.45); color: #fcd34d; background: rgba(245, 158, 11, 0.1); }
  .sk-cost {
    text-align: right; font-family: var(--font-clean);
  }
  .sk-cost strong { display: block; font-size: 1.15rem; color: #9ae6b0; }
  .sk-cost span { font-size: 0.72rem; color: var(--muted); }
  .sk-bar {
    margin-top: 8px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden;
  }
  .sk-bar > i {
    display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--cyan), var(--green));
  }
  .sk-note { margin-top: 16px; font-size: 0.78rem; color: var(--muted); text-align: center; }
  @media (max-width: 560px) {
    .sk-row { grid-template-columns: 1fr; }
    .sk-cost { text-align: left; }
  }
</style>
</head>
<body>
<main class="sk-page">
  <div class="sk-return" id="sk-return" hidden>
    <button type="button" class="sk-return-btn" id="sk-return-btn">← Back</button>
    <span class="sk-return-hint" id="sk-return-hint"></span>
  </div>
  <header class="sk-hero">
    <h1>Water Line Sketch</h1>
    <p>Pick a hospitality setup to see illustrative monthly water costs by line — dishwash, pre-rinse, taps, ice, washrooms.</p>
  </header>
  <p class="sk-trust" id="sk-trust">Illustrative water duty profiles — not your live water bill.</p>
  <p class="sk-status" id="sk-status" aria-live="polite"></p>
  <div class="sk-lanes" id="sk-lanes" role="tablist" aria-label="Water profiles"></div>
  <section class="sk-summary" id="sk-summary" hidden>
    <h2 id="sk-title">Profile</h2>
    <p id="sk-blurb"></p>
    <div class="sk-totals" id="sk-totals"></div>
  </section>
  <div class="sk-toolbar" id="sk-toolbar" hidden>
    <button type="button" class="sk-btn sk-btn--gold" id="sk-open-finder">Water Saving Finder</button>
    <button type="button" class="sk-btn" id="sk-open-guide">Water saving guide</button>
    <button type="button" class="sk-btn" id="sk-open-scheme">Scheme Fit</button>
    <button type="button" class="sk-btn sk-btn--green" id="sk-ask-zyanne">Ask Zyanne</button>
    <button type="button" class="sk-btn sk-btn--green" id="sk-ask-andrieus">Ask Andrieus</button>
  </div>
  <ul class="sk-equip" id="sk-equip"></ul>
  <p class="sk-note" id="sk-tariff">Water modelled at ~€2.50/m³ (retail + wastewater share).</p>
</main>
<script>
(function () {
  var MODULE_ID = "water-line-sketch";
  var state = { profileId: "busy-kitchen", payload: null };

  var lanesEl = document.getElementById("sk-lanes");
  var statusEl = document.getElementById("sk-status");
  var summaryEl = document.getElementById("sk-summary");
  var titleEl = document.getElementById("sk-title");
  var blurbEl = document.getElementById("sk-blurb");
  var totalsEl = document.getElementById("sk-totals");
  var equipEl = document.getElementById("sk-equip");
  var toolbarEl = document.getElementById("sk-toolbar");
  var trustEl = document.getElementById("sk-trust");
  var tariffEl = document.getElementById("sk-tariff");

  function escapeHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function fmtEur(n) {
    var v = Math.round(Number(n) || 0);
    return "€" + v.toLocaleString("en-GB");
  }

  function closeParentModule() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "gw-module-close", moduleId: MODULE_ID }, "*");
        return true;
      }
    } catch (_) {}
    return false;
  }

  function openParentModule(moduleId, overrides) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(
          { type: "gw-module-open", moduleId: moduleId, overrides: overrides || {} },
          "*"
        );
        return true;
      }
    } catch (_) {}
    return false;
  }

  function initReturnNav() {
    var bar = document.getElementById("sk-return");
    var btn = document.getElementById("sk-return-btn");
    var hint = document.getElementById("sk-return-hint");
    if (!bar || !btn) return;
    var params = new URLSearchParams(location.search);
    var fromLabel = params.get("fromLabel") || "";
    var from = params.get("from") || "";
    var returnHref = params.get("return") || "";
    var embed = params.get("embed") === "1" || params.get("popup") === "1";
    var inFrame = false;
    try { inFrame = window.parent && window.parent !== window; } catch (_) { inFrame = true; }
    var label = fromLabel || "← Back to Zyanne";
    if (!fromLabel && from.indexOf("finance") >= 0) label = "← Back to Vincent";
    if (!fromLabel && from.indexOf("grants") >= 0) label = "← Back to Andrieus";
    if (!fromLabel && from.indexOf("deals") >= 0) label = "← Back to Zara";
    if (!fromLabel && !from && !embed && !inFrame) {
      label = "← Back to Orchestra";
      returnHref = returnHref || "/greenways/orchestra-hub";
    }
    btn.textContent = label;
    bar.hidden = false;
    if (hint) hint.textContent = embed || inFrame ? "Chat stays open behind this panel" : "Return to Greenways";
    btn.addEventListener("click", function () {
      if (embed || inFrame) {
        if (!closeParentModule()) location.href = returnHref || "/greenways/sustainable-products-agent";
        return;
      }
      location.href = returnHref || "/greenways/sustainable-products-agent";
    });
  }

  function bridgeAsk(slug, topic) {
    var Bridge = window.GreenwaysAgentTopicBridge;
    var href;
    if (Bridge && typeof Bridge.buildHref === "function") {
      href = Bridge.buildHref({
        path: "/greenways/" + slug,
        toSlug: slug,
        fromSlug: MODULE_ID,
        fromLabel: "Water Line Sketch",
        topic: topic
      });
    } else {
      href = "/greenways/" + slug + "?bridge=1&topic=" + encodeURIComponent(topic) + "&from=Water%20Line%20Sketch";
    }
    try { window.top.location.href = href; } catch (_) { window.location.href = href; }
  }

  function renderLanes(profiles, active) {
    if (!profiles || !profiles.length) {
      profiles = [
        { id: "small-cafe", title: "Small café" },
        { id: "busy-kitchen", title: "Busy kitchen" },
        { id: "high-volume-bar", title: "High-volume bar" }
      ];
    }
    lanesEl.innerHTML = profiles
      .map(function (p) {
        return (
          '<button type="button" class="sk-lane' +
          (p.id === active ? " is-active" : "") +
          '" data-profile="' +
          escapeHtml(p.id) +
          '" role="tab" aria-selected="' +
          (p.id === active ? "true" : "false") +
          '"><strong>' +
          escapeHtml(p.title || p.id) +
          "</strong><span>" +
          escapeHtml(p.seatsHint || p.blurb || "") +
          "</span></button>"
        );
      })
      .join("");
  }

  function renderSketch(payload) {
    var profile = payload.profile || {};
    var meta = payload.meta || {};
    state.payload = payload;
    state.profileId = profile.id || state.profileId;

    summaryEl.hidden = false;
    toolbarEl.hidden = false;
    titleEl.textContent = profile.title || "Water sketch";
    blurbEl.textContent = profile.blurb || "";

    if (meta.trustNote || profile.trustNote) {
      trustEl.textContent = meta.trustNote || profile.trustNote;
    }
    if (meta.tariffNote || profile.tariffNote) {
      tariffEl.textContent = meta.tariffNote || profile.tariffNote;
    }

    var totals = profile.totals || {};
    var byLine = totals.byLine || {};
    totalsEl.innerHTML =
      '<div class="sk-total"><strong>Monthly €</strong><span>' +
      escapeHtml(fmtEur(totals.monthlyEur)) +
      '</span></div><div class="sk-total"><strong>Annual €</strong><span>' +
      escapeHtml(fmtEur(totals.annualEur)) +
      '</span></div><div class="sk-total"><strong>Monthly m³</strong><span>' +
      escapeHtml(String(totals.monthlyM3 || 0)) +
      "</span></div>" +
      Object.keys(byLine)
        .map(function (k) {
          return (
            '<div class="sk-total"><strong>' +
            escapeHtml(k) +
            "</strong><span>" +
            escapeHtml(fmtEur(byLine[k])) +
            "/mo</span></div>"
          );
        })
        .join("");

    var rows = profile.equipment || [];
    equipEl.innerHTML = rows
      .map(function (row) {
        var line = String(row.line || "water").toLowerCase();
        var share = Number(row.sharePct) || 0;
        return (
          '<li class="sk-row"><div><h3>' +
          escapeHtml(row.name || "Water line") +
          "</h3><p>" +
          escapeHtml(row.note || "") +
          '</p><div class="sk-meta"><span class="sk-chip">' +
          escapeHtml(line) +
          "</span>" +
          (row.monthlyM3
            ? '<span class="sk-chip">~' + escapeHtml(String(row.monthlyM3)) + " m³/mo</span>"
            : "") +
          '</div><div class="sk-bar" aria-hidden="true"><i style="width:' +
          share +
          '%"></i></div></div><div class="sk-cost"><strong>' +
          escapeHtml(fmtEur(row.monthlyEur)) +
          '</strong><span>/mo · ' +
          escapeHtml(String(share)) +
          "% of sketch</span></div></li>"
        );
      })
      .join("");

    statusEl.textContent = "";
    statusEl.className = "sk-status";
  }

  async function loadSketch(profileId) {
    statusEl.textContent = "Loading sketch…";
    statusEl.className = "sk-status";
    try {
      var url = "/api/water-line-sketch?profile=" + encodeURIComponent(profileId || "busy-kitchen");
      var res = await fetch(url, { cache: "no-store" });
      var data = await res.json();
      if (!res.ok || !data || !data.ok) throw new Error((data && data.error) || "Could not load sketch");
      renderLanes(data.availableProfiles, data.profile && data.profile.id);
      renderSketch(data);
    } catch (err) {
      statusEl.textContent = err.message || "Could not load water line sketch";
      statusEl.className = "sk-status is-error";
      summaryEl.hidden = true;
      toolbarEl.hidden = true;
    }
  }

  lanesEl.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-profile]");
    if (!btn) return;
    loadSketch(btn.getAttribute("data-profile"));
  });

  document.getElementById("sk-open-finder").addEventListener("click", function () {
    if (!openParentModule("water-saving-finder", { query: "demo=1" })) {
      window.open("/greenways/water-saving-finder?demo=1", "_blank");
    }
  });

  document.getElementById("sk-open-guide").addEventListener("click", function () {
    if (!openParentModule("water-saving-guide", {})) {
      window.open("/HTMLS%20GWM%20GWB/Water-Saving-Guide%20(1).html", "_blank");
    }
  });

  document.getElementById("sk-open-scheme").addEventListener("click", function () {
    if (!openParentModule("scheme-fit", { query: "lane=dishwasher&region=nl&demo=1" })) {
      window.open("/greenways/scheme-fit?lane=dishwasher&region=nl&demo=1", "_blank");
    }
  });

  document.getElementById("sk-ask-zyanne").addEventListener("click", function () {
    var title = (state.payload && state.payload.profile && state.payload.profile.title) || "this water sketch";
    var monthly = state.payload && state.payload.profile && state.payload.profile.totals && state.payload.profile.totals.monthlyEur;
    bridgeAsk(
      "sustainable-products-agent",
      "From the " +
        title +
        " water sketch (~€" +
        Math.round(monthly || 0) +
        "/mo), which water-saving products should I prioritise?"
    );
  });

  document.getElementById("sk-ask-andrieus").addEventListener("click", function () {
    var title = (state.payload && state.payload.profile && state.payload.profile.title) || "this site";
    bridgeAsk(
      "grants-agent",
      "Which grants fit water-saving dishwashers and fixtures for " + title + "?"
    );
  });

  initReturnNav();
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "gw-module-embed-ready", moduleId: MODULE_ID }, "*");
    }
  } catch (_) {}

  var bootParams = new URLSearchParams(location.search);
  if (window.GreenwaysModuleDemo && window.GreenwaysModuleDemo.isDemo(bootParams)) {
    window.GreenwaysModuleDemo.mountBanner({ before: document.querySelector(".sk-hero") });
  }
  var startProfile = bootParams.get("profile") || bootParams.get("id") || "busy-kitchen";
  loadSketch(startProfile);
})();
</script>
</body>
</html>
