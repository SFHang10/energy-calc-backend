<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="wix-html-scroll" content="no-scroll">
  <title>Greenways Buildings — Deals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #00f582;
      --accent-dim: rgba(0, 245, 130, 0.12);
      --accent-hot: rgba(0, 245, 130, 0.22);
      --black: #0A0A0A;
      --dark: #111111;
      --panel: #191919;
      --border: #2A2A2A;
      --text: #F0EDE8;
      --text-dim: #888880;
      --text-faint: #444440;
      --font: 'Space Grotesk', sans-serif;
      --font-clean: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      /* Page backdrop — rollback: remove class deals-shell--backdrop from <body> */
      --deals-page-backdrop-image: url("https://static.wixstatic.com/media/c123de_6d64dbcce52a466ab4146d7e83713731~mv2.jpg");
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--black);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      overflow: hidden;
    }
    /* Photo backdrop (main dashboard style) — hidden unless body has .deals-shell--backdrop */
    .deals-page-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-color: var(--black);
      background-image:
        linear-gradient(rgba(5, 14, 9, 0.38), rgba(5, 14, 9, 0.44)),
        radial-gradient(circle at 22% 18%, rgba(0, 245, 130, 0.06), transparent 48%),
        var(--deals-page-backdrop-image);
      background-size: cover, cover, cover;
      background-position: center, center, center;
      background-repeat: no-repeat;
      opacity: 0.92;
      filter: brightness(0.88) saturate(1.05);
    }
    body.deals-shell--backdrop .deals-page-backdrop { display: block; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
    }
    header {
      position: relative;
      z-index: 10;
      background: var(--dark);
      border-bottom: 1px solid var(--border);
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      flex-shrink: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent) 0%, #0a5c36 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .logo-text {
      font-family: var(--font);
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      line-height: 1;
    }
    .logo-sub {
      font-size: 0.62rem;
      color: var(--accent);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-family: var(--mono);
      margin-top: 2px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-header {
      padding: 7px 14px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text-dim);
      transition: all 0.15s;
    }
    .btn-header:hover {
      border-color: var(--accent-hot);
      color: var(--text);
    }
    .btn-header.primary {
      background: var(--accent-dim);
      border-color: var(--accent-hot);
      color: var(--accent);
    }
    .btn-header.primary:hover {
      background: rgba(0, 245, 130, 0.2);
    }
    .shell {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      flex: 1;
      min-height: 0;
    }
    body.deals-shell--backdrop header,
    body.deals-shell--backdrop aside,
    body.deals-shell--backdrop .main-toolbar {
      background: rgba(17, 17, 17, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    aside {
      background: var(--dark);
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }
    .sidebar-section {
      padding: 1.1rem 1.1rem 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-label {
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      font-family: var(--font);
      margin-bottom: 0.65rem;
    }
    .sidebar-note {
      font-family: var(--font-clean);
      font-size: 0.72rem;
      font-weight: 500;
      line-height: 1.5;
      color: var(--text-dim);
    }
    .quick-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }
    .quick-btn {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.18s, color 0.18s, background 0.18s, box-shadow 0.18s, opacity 0.18s, filter 0.18s;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      z-index: 0;
    }
    a.quick-btn { color: var(--text-dim); }
    button.quick-btn {
      width: 100%;
      font: inherit;
      appearance: none;
      color: var(--text-dim);
    }
    .quick-btn:hover {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(0, 245, 130, 0.06);
    }
    .quick-btn-icon { font-size: 1rem; flex-shrink: 0; line-height: 1; }
    .quick-btn-label {
      flex: 1;
      min-width: 0;
      line-height: 1.25;
    }
    /* Dim siblings so the pressed finder’s subject stands out */
    .quick-actions.has-active .quick-btn:not(.is-active) {
      opacity: 0.42;
      filter: brightness(0.55);
      color: var(--text-faint);
      border-color: #1a1a1a;
      background: #101010;
      pointer-events: auto;
    }
    .quick-actions.has-active .quick-btn:not(.is-active)::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(0, 0, 0, 0.62);
      pointer-events: none;
      z-index: 1;
    }
    .quick-actions.has-active .quick-btn:not(.is-active):hover {
      opacity: 0.72;
      filter: brightness(0.85);
      color: var(--text-dim);
    }
    .quick-btn.is-active {
      z-index: 2;
      opacity: 1;
      filter: none;
      color: #fff;
      font-weight: 700;
      border-color: var(--accent);
      background: linear-gradient(180deg, rgba(0, 245, 130, 0.16), rgba(0, 0, 0, 0.35));
      box-shadow:
        0 0 0 1px rgba(0, 245, 130, 0.35),
        0 8px 22px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .quick-btn.is-active .quick-btn-label {
      color: #f7fff9;
      letter-spacing: 0.03em;
      text-shadow: 0 0 14px rgba(0, 245, 130, 0.45);
    }
    .quick-btn.is-active[data-finder="energy"] {
      border-color: #f5b942;
      background: linear-gradient(180deg, rgba(245, 185, 66, 0.2), rgba(0, 0, 0, 0.4));
      box-shadow:
        0 0 0 1px rgba(245, 185, 66, 0.4),
        0 8px 22px rgba(0, 0, 0, 0.45);
    }
    .quick-btn.is-active[data-finder="energy"] .quick-btn-label {
      text-shadow: 0 0 14px rgba(245, 185, 66, 0.5);
    }
    .quick-btn.is-active[data-finder="water"] {
      border-color: #4ec8e8;
      background: linear-gradient(180deg, rgba(78, 200, 232, 0.22), rgba(0, 0, 0, 0.4));
      box-shadow:
        0 0 0 1px rgba(78, 200, 232, 0.45),
        0 8px 22px rgba(0, 0, 0, 0.45);
    }
    .quick-btn.is-active[data-finder="water"] .quick-btn-label {
      text-shadow: 0 0 14px rgba(78, 200, 232, 0.55);
    }
    .quick-btn.is-active[data-finder="products"] {
      border-color: #3dcf7a;
      background: linear-gradient(180deg, rgba(61, 207, 122, 0.22), rgba(0, 0, 0, 0.4));
      box-shadow:
        0 0 0 1px rgba(61, 207, 122, 0.45),
        0 8px 22px rgba(0, 0, 0, 0.45);
    }
    .quick-btn.is-active[data-finder="products"] .quick-btn-label {
      text-shadow: 0 0 14px rgba(61, 207, 122, 0.55);
    }
    main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #000;
      position: relative;
      z-index: 2;
    }
    body.deals-shell--backdrop main {
      background: transparent;
    }
    .main-toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--dark);
    }
    .main-toolbar span {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
    }
    .frame-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    .frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      aside { display: none; }
    }
  </style>
</head>
<body class="deals-shell--backdrop">
  <div class="deals-page-backdrop" aria-hidden="true"></div>
  <div class="shell">
    <header>
      <div class="logo">
        <div class="logo-icon">🏷️</div>
        <div>
          <div class="logo-text">GREENWAYS</div>
          <div class="logo-sub">Buildings · Deals</div>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-header" id="dealsBackBtn" onclick="window.location.href='./Greenways%20Interface%20.html'">← Dashboard</button>
        <button type="button" class="btn-header primary" onclick="document.getElementById('dealsFrame').contentWindow.location.reload()">Refresh hub</button>
        <a class="btn-header primary" id="dealsOpenTab" href="./deals-ticker-hub.html" target="_blank" rel="noopener noreferrer" style="text-decoration:none;display:inline-flex;align-items:center;">Open tab</a>
      </div>
    </header>

    <div class="app">
      <aside>
        <div class="sidebar-section">
          <div class="sidebar-label">Full finders</div>
          <div class="quick-actions" id="dealsFinderActions">
            <a class="quick-btn" href="./european_energy_deals_portal.html" data-finder="energy" data-module-id="european-energy" data-finder-src="./european_energy_deals_portal.html"><span class="quick-btn-icon" aria-hidden="true">⚡</span><span class="quick-btn-label">Energy deals portal</span></a>
            <a class="quick-btn" href="./water-saving-finder.html" data-finder="water" data-module-id="water-saving-finder" data-finder-src="./water-saving-finder.html"><span class="quick-btn-icon" aria-hidden="true">💧</span><span class="quick-btn-label">Water saving finder</span></a>
            <a class="quick-btn" href="./sustainable_product_deal_finder_portal.html" data-finder="products" data-module-id="sustainable-product-finder" data-finder-src="./sustainable_product_deal_finder_portal.html"><span class="quick-btn-icon" aria-hidden="true">🌿</span><span class="quick-btn-label">Sustainable products</span></a>
            <button type="button" class="quick-btn" id="dealsShowHubBtn" hidden><span class="quick-btn-icon" aria-hidden="true">🏷️</span><span class="quick-btn-label">Back to deals lanes</span></button>
          </div>
        </div>
        <div class="sidebar-section" hidden>
          <div class="sidebar-label">Feed</div>
          <p class="sidebar-note">Highlights refresh when you run <strong style="color:var(--text)">npm run build:deals-feed</strong> in the repo. Search and filters run in the hub below.</p>
        </div>
      </aside>

      <main>
        <div class="main-toolbar">
          <span id="dealsToolbarLabel">Deals hub · scroll lanes + search</span>
        </div>
        <div class="frame-wrap">
          <iframe
            id="dealsFrame"
            title="Greenways deals hub — energy, water, sustainability"
            src="./deals-ticker-hub.html"
          ></iframe>
        </div>
      </main>
    </div>
  </div>
  <script>
  (function () {
    var params = new URLSearchParams(location.search);
    var inFrame = false;
    try { inFrame = window.parent && window.parent !== window; } catch (_) { inFrame = true; }
    var isEmbed = params.get("embed") === "1" || params.get("popup") === "1" || inFrame;
    var hubSrc = "./deals-ticker-hub.html?embed=1";
    var frame = document.getElementById("dealsFrame");
    var hubBtn = document.getElementById("dealsShowHubBtn");
    var toolbar = document.getElementById("dealsToolbarLabel");
    var backBtn = document.getElementById("dealsBackBtn");
    var openTab = document.getElementById("dealsOpenTab");

    if (frame) frame.src = hubSrc;

    if (isEmbed) {
      document.body.classList.add("deals-shell--embed");
      if (openTab) openTab.hidden = true;
      if (backBtn) {
        backBtn.textContent = "← Back to chat";
        backBtn.onclick = function () {
          try {
            window.parent.postMessage({ type: "gw-module-close", moduleId: "deals-full-page" }, "*");
          } catch (_) {}
        };
      }
    }

    function postToAgent(payload) {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, "*");
          return true;
        }
      } catch (_) {}
      return false;
    }

    var finderActions = document.getElementById("dealsFinderActions");

    function setActiveFinder(btn) {
      if (!finderActions) return;
      finderActions.querySelectorAll(".quick-btn").forEach(function (el) {
        el.classList.toggle("is-active", el === btn);
        if (el === btn) el.setAttribute("aria-current", "true");
        else el.removeAttribute("aria-current");
      });
      finderActions.classList.toggle("has-active", !!btn);
    }

    function clearActiveFinder() {
      setActiveFinder(null);
    }

    function openFinder(moduleId, src, label, btn) {
      if (btn) setActiveFinder(btn);
      if (isEmbed && moduleId && postToAgent({
        type: "gw-module-open",
        moduleId: moduleId,
        overrides: {
          query: "embed=1&popup=1",
          title: label || undefined
        }
      })) {
        return;
      }
      if (frame && src) {
        frame.src = src + (src.indexOf("?") >= 0 ? "&" : "?") + "embed=1";
        if (hubBtn) hubBtn.hidden = false;
        if (toolbar) toolbar.textContent = (label || "Finder") + " · inside deals shell";
        return;
      }
      if (src) window.open(src, "_blank", "noopener,noreferrer");
    }

    document.querySelectorAll(".quick-btn[data-module-id]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        var labelEl = a.querySelector(".quick-btn-label");
        openFinder(
          a.getAttribute("data-module-id"),
          a.getAttribute("data-finder-src") || a.getAttribute("href"),
          (labelEl ? labelEl.textContent : a.textContent || "").replace(/\s+/g, " ").trim(),
          a
        );
      });
    });

    if (hubBtn) {
      hubBtn.addEventListener("click", function () {
        if (frame) frame.src = hubSrc;
        hubBtn.hidden = true;
        clearActiveFinder();
        if (toolbar) toolbar.textContent = "Deals hub · scroll lanes + search";
      });
    }

    /* Relay nested hub → agent content module */
    window.addEventListener("message", function (event) {
      var data = event && event.data;
      if (!data || typeof data !== "object") return;
      if (data.type === "gw-module-open" || data.type === "gw-module-close" || data.type === "gw-module-back") {
        postToAgent(data);
      }
    });
  })();
  </script>
</body>
</html>
