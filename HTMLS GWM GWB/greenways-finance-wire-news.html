<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="wix-html-scroll" content="no-scroll" />
  <title>Vincent — Finance wire news</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="/HTMLS%20GWM%20GWB/js/greenways-portal-embed.js"></script>
  <style>
    :root {
      --blue: #38bdf8;
      --gold: #c9a961;
      --bg: #0a1018;
      --panel: rgba(12, 20, 32, 0.88);
      --border: rgba(56, 189, 248, 0.22);
      --text: #e8f0ff;
      --muted: #8ba3c4;
      --font: 'Space Grotesk', system-ui, sans-serif;
      --clean: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --vincent-backdrop-image: url("https://static.wixstatic.com/media/c123de_1fe1c58ec83544f0b0eaf57cf9ac4e02~mv2.avif");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background-color: var(--bg);
      background-image: var(--vincent-backdrop-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font);
      overflow-x: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(5, 9, 14, 0.62) 0%, rgba(8, 12, 18, 0.72) 45%, rgba(4, 7, 12, 0.82) 100%),
        radial-gradient(ellipse 80% 55% at 50% -10%, rgba(56, 189, 248, 0.1), transparent 55%);
    }
    body.embed-mode {
      background-color: rgba(5, 9, 14, 0.94);
      background-image: none;
      background-attachment: scroll;
    }
    body.embed-mode::before { display: none; }
    html.embed-mode { background: transparent; }
    body.embed-mode .page-nav { display: none; }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px 14px 28px;
      position: relative;
      z-index: 1;
    }
    .page-nav { margin-bottom: 12px; }
    .page-nav a {
      color: var(--blue);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    .eyebrow {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .lead {
      font-family: var(--clean);
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 16px;
      max-width: 62ch;
    }
    .spot-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    @media (max-width: 800px) {
      .spot-row { grid-template-columns: 1fr; }
    }
    .spot {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 14px 12px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }
    .spot-kicker {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 8px;
    }
    .spot-kicker::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.7);
    }
    .spot.gold .spot-kicker { color: var(--gold); }
    .spot.gold .spot-kicker::before {
      background: var(--gold);
      box-shadow: 0 0 8px rgba(201, 169, 97, 0.7);
    }
    .spot h2 {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 6px;
    }
    .spot p {
      font-family: var(--clean);
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .spot a {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .spot a:hover { border-color: var(--blue); color: var(--blue); }
    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row {
      display: grid;
      grid-template-columns: 88px 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 10px 12px;
      border: 1px solid rgba(56, 189, 248, 0.14);
      border-radius: 10px;
      background: rgba(8, 14, 22, 0.75);
    }
    @media (max-width: 640px) {
      .row { grid-template-columns: 1fr; }
    }
    .row-tag {
      font-family: var(--mono);
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      padding-top: 3px;
    }
    .row h3 {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .row p {
      font-family: var(--clean);
      font-size: 0.74rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .row a {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--blue);
      text-decoration: none;
      white-space: nowrap;
      padding-top: 3px;
    }
    .status {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--muted);
      margin: 8px 0 14px;
    }
    .status.error { color: #f87171; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="page-nav"><a href="/greenways/finance-wire">← Finance wire</a></nav>
    <div class="eyebrow">Vincent · finance lens</div>
    <h1>Market &amp; funding stories</h1>
    <p class="lead">Sustainability and energy headlines with a finance angle — same news catalogue as Cheryce, filtered for grants, prices, loans, and upgrade pressure.</p>
    <div class="status" id="status">Loading stories…</div>
    <div class="spot-row" id="spots"></div>
    <div class="list" id="list"></div>
  </div>
  <script>
    (function () {
      function origin() {
        var h = location.hostname || '';
        if (h === 'localhost' || h === '127.0.0.1' || h.indexOf('energy-calc-backend') !== -1) {
          return location.origin || '';
        }
        return 'https://energy-calc-backend.onrender.com';
      }

      function esc(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function itemHref(item) {
        if (item && item.url && /^https?:\/\//i.test(item.url)) return item.url;
        if (item && item.href) {
          if (/^https?:\/\//i.test(item.href)) return item.href;
          return origin() + (item.href.charAt(0) === '/' ? item.href : '/' + item.href);
        }
        return '/greenways/media-agent';
      }

      function blurb(item) {
        return item.summary || item.excerpt || item.description || item.teaser || 'Open for the full story and Vincent’s finance take.';
      }

      function render(items) {
        var status = document.getElementById('status');
        var spots = document.getElementById('spots');
        var list = document.getElementById('list');
        if (!items.length) {
          status.className = 'status error';
          status.textContent = 'No finance-tagged stories yet — ask Vincent or Cheryce for a briefing.';
          return;
        }
        status.textContent = items.length + ' stories · finance / energy / funding lens';
        var top = items.slice(0, 3);
        var rest = items.slice(3, 12);
        spots.innerHTML = top.map(function (item, i) {
          var cls = i === 2 ? 'spot gold' : 'spot';
          var kicker = i === 2 ? 'Funding spotlight' : 'Market spotlight';
          return (
            '<article class="' + cls + '">' +
            '<div class="spot-kicker">' + kicker + '</div>' +
            '<h2>' + esc(item.title || 'Untitled') + '</h2>' +
            '<p>' + esc(blurb(item)).slice(0, 140) + '</p>' +
            '<a href="' + esc(itemHref(item)) + '" target="_top" rel="noopener">Open story</a>' +
            '</article>'
          );
        }).join('');
        list.innerHTML = rest.map(function (item) {
          var tag = item.newsCategory || item.edition || item.topic || 'News';
          return (
            '<article class="row">' +
            '<div class="row-tag">' + esc(tag) + '</div>' +
            '<div><h3>' + esc(item.title || 'Untitled') + '</h3><p>' + esc(blurb(item)).slice(0, 180) + '</p></div>' +
            '<a href="' + esc(itemHref(item)) + '" target="_top" rel="noopener">Open</a>' +
            '</article>'
          );
        }).join('');
      }

      fetch(origin() + '/api/media-agent/news?q=finance%20grant%20energy%20price%20loan&limit=12')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          var items = (data && data.items) || [];
          if (!items.length) {
            return fetch(origin() + '/api/media-agent/news?limit=12').then(function (r2) {
              return r2.ok ? r2.json() : null;
            });
          }
          return data;
        })
        .then(function (data) {
          render((data && data.items) || []);
        })
        .catch(function () {
          document.getElementById('status').className = 'status error';
          document.getElementById('status').textContent = 'Could not load news — try again shortly.';
        });
    })();
  </script>
</body>
</html>
