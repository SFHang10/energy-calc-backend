<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vincent — Energy prices board</title>
  <meta name="wix-html-scroll" content="no-scroll" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/HTMLS%20GWM%20GWB/js/greenways-finance-prices-board.css" />
  <script src="/HTMLS%20GWM%20GWB/js/greenways-portal-embed.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0a1018;
      color: #e8f0ff;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 20px 16px 32px;
    }
    h1 {
      font-size: 1.2rem;
      margin: 0 0 12px;
    }
    .lead {
      font-size: 13px;
      color: #8ba3c4;
      margin: 0 0 16px;
      line-height: 1.5;
    }
    .wire-hero-banner {
      position: relative;
      margin: 0 0 14px;
      height: clamp(112px, 18vw, 168px);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #1a1a1a;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
      background-color: #070b12;
      background-image:
        linear-gradient(135deg, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.36)),
        url("https://static.wixstatic.com/media/c123de_a7746ac7981d466095fdc261bb208fa8~mv2.jpg");
      background-size: cover;
      background-position: center;
    }
    body.embed-mode .page-nav { display: none; }
    body.embed-mode .wire-hero-banner { max-height: 118px; margin-bottom: 10px; }
    .page-nav {
      margin-bottom: 14px;
    }
    .page-nav a {
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="page-nav"><a href="/greenways/finance-agent">← Vincent</a></nav>
    <h1>Energy prices board</h1>
    <div class="wire-hero-banner" role="img" aria-label="Energy markets — price and trading backdrop"></div>
    <p class="lead">Wholesale hub guide for finance conversations — pair with Finance Finder for retail tariffs and peak/off-peak timing.</p>
    <div id="prices-board-root"></div>
  </div>
  <script src="/HTMLS%20GWM%20GWB/js/greenways-finance-prices-board.js"></script>
  <script>
    GreenwaysFinancePricesBoard.mount('#prices-board-root');
  </script>
</body>
</html>
