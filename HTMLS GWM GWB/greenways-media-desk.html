<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="wix-html-scroll" content="no-scroll" />
  <title>Cheryce — Media desk</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/HTMLS%20GWM%20GWB/js/greenways-portal-nav.css" />
  <link rel="stylesheet" href="/HTMLS%20GWM%20GWB/js/greenways-desk-rail.css" />
  <script src="/HTMLS%20GWM%20GWB/js/greenways-portal-embed.js"></script>
  <style>
    :root {
      --bg: #0a0712;
      --panel: #120a1c;
      --border: rgba(168, 85, 247, 0.28);
      --text: #f5f3ff;
      --muted: #9ca8bf;
      --violet: #a855f7;
      --lilac: #c084fc;
      --gold: #c9a961;
      --font: 'Space Grotesk', system-ui, sans-serif;
      --clean: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --cheryce-backdrop-image: url("https://static.wixstatic.com/media/c123de_30cd3bb450684c64b1069fdaaae7ab7d~mv2.jpeg");
      --desk-border: rgba(168, 85, 247, 0.28);
      --desk-rail-accent: #c084fc;
      --desk-rail-accent-dim: rgba(168, 85, 247, 0.18);
      --desk-rail-accent-active-bg: rgba(168, 85, 247, 0.12);
      --desk-rail-accent-glow: rgba(168, 85, 247, 0.15);
      --desk-rail-accent-ico: rgba(192, 132, 252, 0.45);
      --desk-rail-back-divider: rgba(168, 85, 247, 0.12);
      --desk-rail-text: #ddd6fe;
      --desk-rail-active-text: #f3e8ff;
      --desk-rail-link: #c084fc;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; color: var(--text); font-family: var(--font); background: var(--bg); }
    body {
      background-image: var(--cheryce-backdrop-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(8, 5, 14, 0.78), rgba(6, 4, 10, 0.9));
    }
    body.embed-mode { background-image: none; background-color: rgba(8, 5, 14, 0.96); }
    body.embed-mode::before { display: none; }
    body.embed-mode .media-page-nav, body.embed-mode .back-row { display: none !important; }
    .page { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 18px 16px 40px; }
    .media-page-nav { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .btn {
      display: inline-flex; align-items: center; padding: 8px 12px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.14); background: rgba(8,5,14,0.55);
      color: #ddd6fe; text-decoration: none; font-size: 0.82rem; cursor: pointer; font-family: var(--font);
    }
    .btn--agent { border-color: rgba(168,85,247,0.4); color: var(--lilac); }
    .hero h1 { font-size: 1.65rem; margin: 0 0 8px; }
    .hero p { color: var(--muted); line-height: 1.5; max-width: 720px; margin: 0 0 16px; }
    .stage { background: #07050d; }
    .stage iframe { background: #07050d; }
  </style>
</head>
<body>
  <div class="page">
    <nav class="media-page-nav" aria-label="Page navigation">
      <button type="button" class="btn" id="mediaBackBtn">← Previous page</button>
      <a class="btn btn--agent" href="/greenways/media-agent">Ask Cheryce</a>
    </nav>
    <header class="hero">
      <h1>Media desk</h1>
      <p>
        Cheryce’s news-first tour — browse sustainability editions, open the video desk,
        then explore the map when a headline becomes a case study you want to benchmark.
      </p>
    </header>
    <div class="layout">
      <nav class="rail" aria-label="Media topics">
        <div class="rail-label">Explore</div>
        <button type="button" class="rail-btn active" data-panel="news" aria-pressed="true">
          <span class="ico"><img src="https://static.wixstatic.com/media/c123de_30cd3bb450684c64b1069fdaaae7ab7d~mv2.jpeg" alt="" loading="lazy"></span>
          <span>News edition</span>
        </button>
        <button type="button" class="rail-btn" data-panel="video" aria-pressed="false">
          <span class="ico"><img src="https://static.wixstatic.com/media/c123de_18dbdb1160fe4048bf54df3de814ba32~mv2.jpg" alt="" loading="lazy"></span>
          <span>Video desk</span>
        </button>
        <button type="button" class="rail-btn" data-panel="map" aria-pressed="false">
          <span class="ico"><img src="https://static.wixstatic.com/media/c123de_cdf6d4209eeb4dd190dd900b5b5d4263~mv2.jpeg" alt="" loading="lazy"></span>
          <span>Sustainability map</span>
        </button>
        <button type="button" class="rail-btn" data-panel="references" aria-pressed="false">
          <span class="ico"><img src="https://static.wixstatic.com/media/c123de_82c7779bdacd41fd8b9e26891e32baa2~mv2.jpg" alt="" loading="lazy"></span>
          <span>References</span>
        </button>
        <div class="back-row">
          <a href="/greenways/media-wire">Media wire</a>
          <a href="/greenways/media-agent">← Back to Cheryce</a>
        </div>
      </nav>
      <div class="stage">
        <iframe id="deskFrame" title="Media desk tool" loading="lazy"></iframe>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var PANELS = {
        news: '/content-ops/review/sustainability-news/2026-07-sustainability-news.html',
        video: '/greenways/media-video-desk-embed',
        map: '/greenways/sustainability-map-embed',
        references: '/HTMLS%20GWM%20GWB/Sustainable%20References%20.HTML'
      };
      var VALID = Object.keys(PANELS);

      function origin() {
        var h = location.hostname || '';
        if (h === 'localhost' || h === '127.0.0.1' || h.indexOf('energy-calc-backend') !== -1) {
          return location.origin || 'https://energy-calc-backend.onrender.com';
        }
        return 'https://energy-calc-backend.onrender.com';
      }
      function abs(path) {
        var p = String(path || '').trim();
        if (!p || /^https?:\/\//i.test(p)) return p;
        return origin() + (p.charAt(0) === '/' ? p : '/' + p);
      }

      var frame = document.getElementById('deskFrame');
      var buttons = Array.from(document.querySelectorAll('.rail-btn[data-panel]'));

      function showPanel(key) {
        if (!VALID.includes(key)) key = 'news';
        buttons.forEach(function (btn) {
          var on = btn.dataset.panel === key;
          btn.classList.toggle('active', on);
          btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        frame.src = abs(PANELS[key]);
        try {
          var url = new URL(location.href);
          if (key === 'news') url.searchParams.delete('tab');
          else url.searchParams.set('tab', key);
          history.replaceState(null, '', url.pathname + url.search + url.hash);
        } catch (_) {}
      }

      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () { showPanel(btn.dataset.panel); });
      });

      document.querySelectorAll('a[href^="/greenways/"]').forEach(function (a) {
        a.href = abs(a.getAttribute('href'));
      });

      document.getElementById('mediaBackBtn').addEventListener('click', function () {
        if (window.history.length > 1) window.history.back();
        else window.location.href = abs('/greenways/media-agent');
      });

      var tab = new URLSearchParams(location.search).get('tab');
      showPanel(tab && VALID.includes(tab) ? tab : 'news');
    })();
  </script>
</body>
</html>
