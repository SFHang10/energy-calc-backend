<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="wix-html-scroll" content="no-scroll">
  <title>Greenways — Agent story</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b1410;
    }
    iframe#storyFrame {
      display: block;
      width: 100%;
      height: 820px;
      border: 0;
      background: #060a10;
      overflow: hidden;
      transition: height 0.25s ease;
    }
  </style>
</head>
<body>
  <iframe id="storyFrame" title="Agent story" scrolling="no"></iframe>
  <script>
    (function () {
      var frame = document.getElementById("storyFrame");
      var storyHeight = 820;
      var mode = "story";
      var CHAT_FRAME_H = 800;
      var KNOWN = {
        "grants-agent": 1,
        "finance-agent": 1,
        "equipment-agent": 1,
        "deals-agent": 1,
        "media-agent": 1,
        "sustainable-products-agent": 1,
        "systems-agent": 1
      };

      function slugFromQuery() {
        var path = location.pathname || "";
        var m = path.match(/\/greenways\/agents\/([a-z0-9-]+)\/story-embed-host\/?$/i);
        if (m) return m[1].toLowerCase();
        var q = new URLSearchParams(location.search || "");
        return (q.get("agent") || q.get("slug") || "grants-agent").toLowerCase();
      }

      function loadAgent(slug) {
        frame.src = "/greenways/agents/" + encodeURIComponent(slug) + "/story-embed";
        mode = "story";
        frame.style.height = "820px";
      }

      function applyHeight(px) {
        var h = Math.max(640, Math.min(Number(px) || 820, 12000));
        frame.style.height = h + "px";
      }

      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || typeof data !== "object") return;

        if (data.type === "gw-embed-chrome") {
          mode = data.mode || "story";
          if (mode === "module") {
            applyHeight(data.preferredHeight || CHAT_FRAME_H);
            try {
              frame.scrollIntoView({ behavior: "smooth", block: "start" });
            } catch (_) {}
          } else {
            storyHeight = data.height || storyHeight;
            applyHeight(storyHeight);
          }
          return;
        }

        if (data.type === "gw-embed-height") {
          if (mode === "module") return;
          storyHeight = data.height || storyHeight;
          applyHeight(storyHeight);
        }
      });

      var initial = slugFromQuery();
      loadAgent(KNOWN[initial] ? initial : "grants-agent");
    })();
  </script>
</body>
</html>
